[package]
name = "deckref"
version = "0.1.0"
edition = "2021"
description = "DeckRef - Rust 桌面应用 (eframe + notify + image)"

[dependencies]
eframe = "0.29"
egui = "0.29"
notify = "8"
notify-debouncer-mini = "0.6"
image = "0.25"
thiserror = "2"
anyhow = "1"
drag = "2"
rand = "0.8"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "implement",
] }
raw-window-handle = "0.6"
