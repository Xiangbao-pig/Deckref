[package]
name = "deckref"
version = "0.3.3"
edition = "2021"
description = "DeckRef - Rust 桌面应用 (eframe + notify + image)"
build = "build.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
notify = "8"
notify-debouncer-mini = "0.6"
image = "0.25"
thiserror = "2"
anyhow = "1"
psd = "0.3"
drag = "2"
rand = "0.8"
arboard = "3"
rstar = "0.12"
jpeg-decoder = "0.3"
# static + 1_1：捆绑与头文件 ABI 0x0209 一致的 libwebp，JPEG/WebP 缩略图不依赖系统库。
libwebp-sys2 = { version = "0.1", features = ["static", "1_1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "implement",
] }
raw-window-handle = "0.6"
lnk = "0.6"

[build-dependencies]
winres = "0.1"
ico = "0.5"
image = "0.25"
